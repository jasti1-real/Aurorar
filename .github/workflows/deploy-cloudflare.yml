name: Deploy Aurorar to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          for (const file of ['index.html', 'admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = html.split(/<script[^>]*>/i).slice(1).map(part => part.split('</script>', 1)[0]);
            if (!scripts.length) throw new Error(`No inline scripts found in ${file}`);
            scripts.forEach((script, index) => new vm.Script(script, { filename: `${file}:script-${index + 1}` }));
            console.log(`Validated ${scripts.length} inline script(s) in ${file}`);
          }
          NODE

      - name: Apply pending D1 migrations to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply aurorar --remote

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID" && exit 1)
          npx --yes wrangler@4 deploy
